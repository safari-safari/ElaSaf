plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace "com.elasaf.english"
    compileSdk flutter.compileSdkVersion

    defaultConfig {
        applicationId "com.elasaf.english"
        minSdk flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

flutter {
    source '../..'
}
